org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=3

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# Reel Counter settings that are safe to share (secrets live in local.properties / keystore.properties).
# Support address shown in the app's "Help & feedback". Leave empty until you have one.
reelcounter.supportEmail=
# Where docs/ is hosted, e.g. https://yourname.github.io/reel-counter (no trailing slash).
reelcounter.legalBaseUrl=
